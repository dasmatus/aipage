# Claude AI Integration
# - claude:mr_review  → runs on every MR pipeline, posts a code review comment
# - claude:issue_reply → runs on schedule (set up in GitLab CI/CD → Schedules),
#                        finds open issues without a reply and responds to them
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   ANTHROPIC_API_KEY  – your Anthropic API key (mask it)
#   GITLAB_BOT_TOKEN   – a GitLab personal access token with `api` scope (mask it)
#                        Comments will appear as the token owner, i.e. you.

claude:mr_review:
  stage: review
  image: oven/bun:canary-debian
  script:
    - bun run scripts/claude-mr-review.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

claude:issue_reply:
  stage: review
  image: oven/bun:canary-debian
  script:
    - bun run scripts/claude-issue-reply.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
