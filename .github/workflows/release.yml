name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Build + package via the shared workflow (same steps as CI and nightly).
  # Install tests are left off here to keep tagged releases behaving as
  # before (CI already gates `main` on them); flip `install-tests: true` to
  # make a failing install test block a tagged release as well.
  build:
    name: Build all targets
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      install-tests: false
      artifact-name: aipage-release

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the history and the previous release tag.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      # The release body is this tag's changelog section, generated from the
      # conventional commits since the previous `v*` tag by git-cliff
      # (cliff.toml, scripts/changelog.sh) — the same generator that rebuilds
      # book/src/changelog.md on main.
      - name: Generate release notes (git-cliff, in nix devShell)
        env:
          NOTES_FILE: release-notes.md
        run: |
          # shellcheck disable=SC2016 # the quoted script is expanded by the inner bash
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bash scripts/changelog.sh --release "$GITHUB_REF_NAME" > "$NOTES_FILE"
          '
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release $GITHUB_REF_NAME" > "$NOTES_FILE"
          fi
          cat "$NOTES_FILE"

      - name: Create or update GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file=release-notes.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "AIPage $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "AIPage $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi

          existing_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[].name' || true)"
          for asset in $existing_assets; do
            case "$asset" in
              aipage-chrome.zip|aipage-firefox.xpi|aipage-safari.zip) ;;
              *) gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
            esac
          done
          for asset in aipage-chrome.zip aipage-firefox.xpi aipage-safari.zip; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes >/dev/null 2>&1 || true
          done

          gh release upload "$GITHUB_REF_NAME" \
            aipage-chrome.zip \
            aipage-firefox.xpi \
            aipage-safari.zip
