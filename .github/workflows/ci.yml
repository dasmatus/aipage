name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: clippy + tests (in nix devShell)
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          '

  build:
    name: Build all targets
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: build chrome / firefox / safari
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            cargo run -p xtask -- build-all
          '
      - name: package artifacts
        run: |
          ( cd dist-chrome && zip -r "$PWD/../aipage-chrome.zip" . )
          ( cd dist-safari  && zip -r "$PWD/../aipage-safari.zip"  . )
          mkdir -p packages
          rm -f packages/*.xpi
          bunx web-ext build -s dist-firefox -a packages
          cp packages/*.xpi aipage-firefox.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: aipage-build
          path: |
            aipage-chrome.zip
            aipage-firefox.xpi
            aipage-safari.zip

  e2e:
    name: Playwright (best-effort)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: build + e2e (in nix devShell)
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            cargo run -p xtask -- build --target chrome
            bunx playwright install --with-deps chromium
            env -u LD_PRELOAD bun run test:e2e
          '
