# Run Playwright tests
test:
  stage: test
  needs:
    - build:chrome
    - build:firefox
    - build:safari
  script:
    - bun run test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 2 hours
  only:
    - main
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
