<head>

            <input type="password" id="api-key-input" placeholder="Enter Gemini API Key">
            <p class="hint">Your key is stored locally.</p>
        </div>
        <button id="save-key-btn" class="primary-btn">Save Key</button>
        <button id="back-btn" class="secondary-btn">Back to Chat</button>
