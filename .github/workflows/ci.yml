name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: clippy + tests (in nix devShell)
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          '

  # Builds all three targets, packages them, runs the extension install tests
  # (hard failure) and uploads `aipage-build`. Shared with release.yml and
  # nightly.yml.
  build:
    name: Build all targets
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      install-tests: true
      artifact-name: aipage-build

  e2e:
    name: Playwright (best-effort)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: build + e2e (in nix devShell)
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            cargo run -p xtask -- build --target chrome
            bunx playwright install --with-deps chromium
            env -u LD_PRELOAD bun run test:e2e
          '
