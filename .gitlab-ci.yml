# GitLab CI/CD Pipeline for EduPage AI Sidebar Extension
# Builds and tests the extension for Chrome, Firefox, and Safari

image: node:20

stages:
  - install
  - lint
  - build
  - test
  - package
  - pages

# Cache node_modules for faster builds
cache:
  key:
    files:
      - package.json
      - bun.lock
  paths:
    - node_modules/

# Install dependencies
install_dependencies:
  stage: install
  before_script:
    - npm install -g bun
  script:
    - bun install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# Lint the TypeScript code
lint:
  stage: lint
  needs:
    - install_dependencies
  script:
    - bun run lint
  allow_failure: false

# Build for Chrome
build:chrome:
  stage: build
  needs:
    - install_dependencies
  before_script:
    - npm install -g bun
  script:
    - bun run build:chrome
  artifacts:
    paths:
      - dist-chrome/
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Build for Firefox
build:firefox:
  stage: build
  needs:
    - install_dependencies
  before_script:
    - npm install -g bun
  script:
    - bun run build:firefox
    - npx web-ext lint -s dist-firefox
  artifacts:
    paths:
      - dist-firefox/
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Build for Safari
build:safari:
  stage: build
  needs:
    - install_dependencies
  before_script:
    - npm install -g bun
  script:
    - bun run build:safari
  artifacts:
    paths:
      - dist-safari/
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Run Playwright tests
test:
  stage: test
  needs:
    - build:chrome
  before_script:
    - npm install -g bun
    - npx playwright install --with-deps chromium
  script:
    - bun test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests

# Package Chrome extension
package:chrome:
  stage: package
  needs:
    - build:chrome
    - test
  script:
    - cd dist-chrome && zip -r ../edupage-ai-sidebar-chrome.zip .
  artifacts:
    paths:
      - edupage-ai-sidebar-chrome.zip
    expire_in: 30 days
  only:
    - main
    - tags

# Package Firefox extension
package:firefox:
  stage: package
  needs:
    - build:firefox
    - test
  before_script:
    - mkdir -p packages
  script:
    - npx web-ext build -s dist-firefox -a packages
  artifacts:
    paths:
      - packages/*.xpi
    expire_in: 30 days
  only:
    - main
    - tags

# Package Safari extension (creates distributable directory)
package:safari:
  stage: package
  needs:
    - build:safari
    - test
  script:
    - cd dist-safari && zip -r ../edupage-ai-sidebar-safari.zip .
  artifacts:
    paths:
      - edupage-ai-sidebar-safari.zip
    expire_in: 30 days
  only:
    - main
    - tags

# Deploy documentation to GitLab Pages
pages:
  stage: pages
  needs:
    - install_dependencies
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
    - chmod +x mdbook
    - mv mdbook /usr/local/bin/
    - npm install -g bun marked
  script:
    - chmod +x scripts/build-docs.sh
    - ./scripts/build-docs.sh
  artifacts:
    paths:
      - public
  only:
    - main
