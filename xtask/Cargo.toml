[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `preserve_order` keeps the manifest's key order intact when xtask rewrites
# `version` / `version_name` for stamped (nightly) builds.
serde_json = { workspace = true, features = ["preserve_order"] }
