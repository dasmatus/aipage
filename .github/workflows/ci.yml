name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the changelog guard below can diff against the base branch.
          fetch-depth: 0

      # book/src/changelog.md (CHANGELOG.md) is generated by git-cliff on main
      # (.github/workflows/changelog.yml); hand edits would be overwritten.
      # A pull request may only change it together with the generator itself
      # (cliff.toml / scripts/changelog.sh), i.e. when regenerating it.
      - name: Changelog is generated, not edited
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- book/src/changelog.md CHANGELOG.md)"
          if [ -z "$changed" ]; then
            echo "changelog untouched"
            exit 0
          fi
          if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- cliff.toml scripts/changelog.sh; then
            echo "changelog changed together with its generator config; allowed"
            exit 0
          fi
          echo "::error::$(echo "$changed" | tr '\n' ' ')is generated from the commit history by git-cliff (cliff.toml) and regenerated on every push to main by changelog.yml. Do not edit it in a pull request; write a conventional commit message instead."
          exit 1

      - name: clippy + tests (in nix devShell)
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          '

  # Builds all three targets, packages them, runs the extension install tests
  # (hard failure) and uploads `aipage-build` (chrome zip, unsigned firefox
  # xpi, safari zip) plus `aipage-build-safari-macos` (AIPage.app built on a
  # macOS runner from the same dist-safari). Shared with release.yml and
  # nightly.yml. The Firefox xpi is deliberately left unsigned here: AMO
  # accepts each version string once, and CI builds all carry the committed
  # version.
  build:
    name: Build all targets
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      install-tests: true
      sign-firefox: false
      artifact-name: aipage-build

  e2e:
    name: Playwright (best-effort)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: build + e2e (in nix devShell)
        run: |
          nix develop --accept-flake-config -c bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            cargo run -p xtask -- build --target chrome
            bunx playwright install --with-deps chromium
            env -u LD_PRELOAD bun run test:e2e
          '
