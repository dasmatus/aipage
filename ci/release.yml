# Deploy documentation to GitLab Pages
pages:
  stage: pages
  needs:
    - install_dependencies
  before_script:
    - apt-get update && apt-get install -y mdbook
  script:
    - chmod +x scripts/build-docs.sh
    - ./scripts/build-docs.sh
  artifacts:
    paths:
      - public
  only:
    - main

# Generate Changelog and version bump
changelog:
  stage: release
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git remote set-url origin https://oauth2:${GLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git
    - git checkout $CI_COMMIT_REF_NAME
    - git pull origin $CI_COMMIT_REF_NAME
    - 'bun run release -- --message "chore(release): %s [skip ci]"'
    - git push origin HEAD:$CI_COMMIT_REF_NAME --follow-tags
  only:
    - main
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /^chore\(release\):/

# Automatic Release Publishing
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - package:chrome
    - package:firefox
    - package:safari
  script:
    - glab auth login --token $GLAB_TOKEN
    - glab release create $CI_COMMIT_TAG --name "Release $CI_COMMIT_TAG" --notes "Release $CI_COMMIT_TAG" aipage-chrome.zip packages/*.xpi aipage-safari.zip
  only:
    - main
