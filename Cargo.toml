[workspace]
resolver = "2"
members = [
    "crates/aipage-bindings",
    "crates/aipage-core",
    "crates/aipage-sidebar",
    "crates/aipage-background",
    "crates/aipage-content",
    "xtask",
]

[workspace.package]
version = "1.7.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
aipage-bindings = { path = "crates/aipage-bindings" }
aipage-core = { path = "crates/aipage-core" }

wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
gloo-timers = "0.4"
leptos = { version = "0.8", features = ["csr"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# SHA-256 for the downloaded sidebar bundle (core/background, wasm-compatible)
# and for xtask's `aipage-web.json` manifest.
sha2 = { version = "0.10", default-features = false }

# Size-optimised release profile for the WASM bundles.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
