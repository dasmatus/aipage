# GitLab CI/CD Pipeline for AIPage Extension
# Builds and tests the extension for Chrome, Firefox, and Safari

image: oven/bun:canary-debian
before_script:
  - apt-get update && apt-get install -y nodejs npm

stages:
  - cache
  - lint
  - build
  - test
  - package
  - pages
  - release

# Global environment variables
variables:
  PLAYWRIGHT_BROWSERS_PATH: ".playwright"

# Cache node_modules and Playwright binaries
cache:
  key:
    files:
      - package.json
      - bun.lock
  paths:
    - node_modules/
    - .playwright/

# Install dependencies
install_dependencies:
  stage: cache
  script:
    - bun install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# Lint the TypeScript code
lint:
  stage: lint
  needs:
    - install_dependencies
  script:
    - bun run lint
  allow_failure: false

# Build for Chrome
build:chrome:
  stage: build
  needs:
    - install_dependencies
  script:
    - bun run build:chrome
  artifacts:
    paths:
      - dist-chrome/
    expire_in: 7 days
  only:
    - tags

# Build for Firefox
build:firefox:
  stage: build
  needs:
    - install_dependencies
  script:
    - bun run build:firefox
    - npx web-ext lint -s dist-firefox
  artifacts:
    paths:
      - dist-firefox/
    expire_in: 7 days
  only:
    - tags

# Build for Safari
build:safari:
  stage: build
  needs:
    - install_dependencies
  script:
    - bun run build:safari
  artifacts:
    paths:
      - dist-safari/
    expire_in: 7 days
  only:
    - tags

# Build for Playwright tests (only on branches/MRs)
build:test:
  stage: build
  needs:
    - install_dependencies
  script:
    - bun run build:all
  artifacts:
    paths:
      - dist-chrome/
      - dist-firefox/
      - dist-safari/
    expire_in: 5 hours
  only:
    - main
    - develop
    - merge_requests
    - tags

# Run Playwright tests
test:
  stage: test
  needs:
    - build:test
  before_script:
    - npx playwright install --with-deps chromium
  script:
    - bun test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /^chore\(release\):/

# Package Chrome extension
package:chrome:
  stage: package
  needs:
    - build:chrome
    - test
  script:
    - cd dist-chrome && zip -r ../aipage-chrome.zip .
  artifacts:
    paths:
      - aipage-chrome.zip
    expire_in: 30 days
  only:
    - tags

# Package Firefox extension
package:firefox:
  stage: package
  needs:
    - build:firefox
    - test
  before_script:
    - mkdir -p packages
  script:
    - npx web-ext build -s dist-firefox -a packages
  artifacts:
    paths:
      - packages/*.xpi
    expire_in: 30 days
  only:
    - tags

# Package Safari extension (creates distributable directory)
package:safari:
  stage: package
  needs:
    - build:safari
    - test
  script:
    - cd dist-safari && zip -r ../aipage-safari.zip .
  artifacts:
    paths:
      - aipage-safari.zip
    expire_in: 30 days
  only:
    - tags

# Deploy documentation to GitLab Pages
pages:
  stage: pages
  needs:
    - install_dependencies
  before_script:
    - apt-get update &&  apt-get install -y curl  nodejs npm
    - curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
    - chmod +x mdbook
    - mv mdbook /usr/local/bin/
    - npm install -g marked
  script:
    - chmod +x scripts/build-docs.sh
    - ./scripts/build-docs.sh
  artifacts:
    paths:
      - public
  only:
    - main

# Generate Changelog and version bump
changelog:
  stage: release
  needs:    
    - build:test
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git remote set-url origin https://oauth2:${GITLAB_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git
    - git checkout $CI_COMMIT_REF_NAME
    - git pull origin $CI_COMMIT_REF_NAME
    - 'bun run release -- --message "chore(release): %s [skip ci]"'
    - git push origin HEAD:$CI_COMMIT_REF_NAME --follow-tags
  only:
    - main
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /^chore\(release\):/

# Automatic Release Publishing
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - package:chrome
    - package:firefox
    - package:safari
  script:
    - glab auth login --token $GLAB_TOKEN
    - glab release create $CI_COMMIT_TAG --name "Release $CI_COMMIT_TAG" --notes "Release $CI_COMMIT_TAG" aipage-chrome.zip packages/*.xpi aipage-safari.zip
  only:
    - tags
